   <g id="text_4">
    <text style="font-size: 7.5px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #333333" transform="translate(24.376758 202.110527)">AR: ARADDR ARVALID ARREADY</text>
    <text style="font-size: 7.5px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #333333" transform="translate(20.213672 210.558574)">R : RDATA RRESP RVALID RREADY</text>
    <text style="font-size: 7.5px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #333333" transform="translate(21.745312 219.003105)">AW: AWADDR AWVALID AWREADY</text>
    <text style="font-size: 7.5px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #333333" transform="translate(30.714258 227.449395)">W : WDATA WVALID WREADY</text>
    <text style="font-size: 7.5px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #333333" transform="translate(33.960938 235.897441)">B : BRESP BVALID BREADY</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.25px; font-family: 'Liberation Sans', 'DejaVu Sans'; text-anchor: middle; fill: #111111" x="352.8" y="102.366357" transform="rotate(-0 352.8 102.366357)">Control FSM  (present_state / next_state)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.75px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #333333" transform="translate(221.832598 112.106748)">IDLE, WRITE_ADDRESS_RECEIVED, WRITE_DATA_RECEIVED, PENABLE_WRITE,</text>
    <text style="font-size: 6.75px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #333333" transform="translate(235.707539 119.708408)">WDATA_TRANSFERRED, READ_ADDRESS_RECEIVED, PENABLE_READ,</text>
    <text style="font-size: 6.75px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #333333" transform="translate(266.464863 127.369658)">RDATA_TRANSFERRED   -   a read request wins in IDLE</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.25px; font-family: 'Liberation Sans', 'DejaVu Sans'; text-anchor: middle; fill: #111111" x="640.8" y="102.366357" transform="rotate(-0 640.8 102.366357)">Output decode</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.75px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #333333" transform="translate(565.712578 112.742725)">ARREADY AWREADY WREADY RVALID BVALID</text>
    <text style="font-size: 6.75px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #333333" transform="translate(601.724355 120.345967)">PSEL PENABLE PWRITE</text>
    <text style="font-size: 6.75px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #333333" transform="translate(590.523574 127.369658)">(each a function of present_state)</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.25px; font-family: 'Liberation Sans', 'DejaVu Sans'; text-anchor: middle; fill: #111111" x="270" y="214.585107" transform="rotate(-0 270 214.585107)">sampled_addr</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.75px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #333333" transform="translate(235.370391 224.52958)">ARADDR or AWADDR,</text>
    <text style="font-size: 6.75px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #333333" transform="translate(247.112754 232.653838)">latched in IDLE</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.25px; font-family: 'Liberation Sans', 'DejaVu Sans'; text-anchor: middle; fill: #111111" x="432" y="214.567061" transform="rotate(-0 432 214.567061)">PADDR / PWDATA regs</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.75px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #333333" transform="translate(390.727969 224.385088)">loaded when W is accepted</text>
    <text style="font-size: 6.75px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #333333" transform="translate(409.304707 232.653838)">or a read starts</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 8.25px; font-family: 'Liberation Sans', 'DejaVu Sans'; text-anchor: middle; fill: #111111" x="352.8" y="304.567061" transform="rotate(-0 352.8 304.567061)">Response registers</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.75px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #333333" transform="translate(212.103105 314.38667)">RDATA &lt;= PRDATA (if !PSLVERR);  BRESP, RRESP &lt;= PSLVERR ? SLVERR (2'b10) : OKAY</text>
    <text style="font-size: 6.75px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #333333" transform="translate(260.677266 321.986748)">(the as-found RTL returned DECERR, 2'b11: change CH-001)</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Liberation Sans', 'DejaVu Sans'; text-anchor: middle; fill: #111111" x="860.4" y="200.990742" transform="rotate(-0 860.4 200.990742)">APB3 slave</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7.5px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #333333" transform="translate(818.716406 211.487285)">PADDR PSEL PENABLE</text>
    <text style="font-size: 7.5px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #333333" transform="translate(829.289648 219.931816)">PWRITE PWDATA</text>
