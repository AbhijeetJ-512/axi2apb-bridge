   <g id="text_17">
    <text style="font-style: italic; font-size: 8.25px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #222222" transform="translate(14.4 410.157312)">One transaction at a time: a read or write is accepted in IDLE, one APB transfer is performed (setup phase, then access phase until PREADY), and the response is held until the master takes it.</text>
    <text style="font-style: italic; font-size: 8.25px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #222222" transform="translate(14.4 419.805139)">AWREADY and WREADY are asserted together and only in WRITE_ADDRESS_RECEIVED, so write data that arrives before its address waits. A read request has priority over a simultaneous write request.</text>
   </g>
